# Guition-ESP32-P4-JC1060P470c V2 ("New Panel") 7" Capacitive touch
#
# Hardware configuration file

substitutions:
  name: the
  dname: ${name}-wclk
  uname: ${name}_wclk
  tempscale: "°F"

esphome:
  name: ${dname}

esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  # esp32-p4-evboard is pre-rev3 silicon; stated explicitly so the mismatch
  # is obvious if this is ever rebased onto a production-rev3 board.
  engineering_sample: true
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true
      enable_idf_experimental_features: true

esp_ldo:
  - channel: 3
    voltage: 2.5V

psram:
  mode: hex
  speed: 200MHz

preferences:
  flash_write_interval: 5min

ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  clk:
    pin: GPIO50
    mode: CLK_EXT_IN
  phy_addr: 1
  power_pin: GPIO51

# Enable logging over the USB/TTL port
logger:
  level: DEBUG

# Enable Home Assistant API
api:

# Enable Over-The-Air updates
ota:
  - platform: esphome

output:
  - id: gpio_backlight_pwm
    platform: ledc
    pin: GPIO23
      #    frequency: 100Hz
      #    inverted: false
    #min_power: 0.1 # To prevent the backlight from being too dim
    #    max_power: 0.8 # To prevent overheating due to excessive lighting

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    gamma_correct: 1.0

i2c:
  - id: bus_a
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz

touchscreen:
  - platform: gt911
    id: my_touchscreen
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    address: 0x5D
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

display:
  - platform: mipi_dsi
    model: CUSTOM
    id: my_display
    update_interval: never
    color_order: RGB
    # Panel LCD_RST is GPIO0 on the JC1060P470C_I_W_Y schematic (FPC1 pin 4).
    # The -c profile ships GPIO05, which only reaches the expansion header. A
    # wrong reset pin also suppresses ESPHome's software reset, so a warm reboot
    # (flash, OTA, restart) keeps the previous firmware's panel registers until
    # the next power cycle.
    reset_pin:
      number: GPIO0
    # Initialise the panel before the backlight restores its state (light setup
    # runs at priority ~799); an un-initialised JD9165 shows a bright lavender
    # field, so the backlight must not come on before init.
    setup_priority: 850
    auto_clear_enabled: false
    dimensions:
      width: 1024
      height: 600
    pixel_mode: 16bit
    color_depth: 16
    lanes: 2
    lane_bit_rate: 750Mbps
    pclk_frequency: 52MHz
    hsync_pulse_width: 24
    hsync_back_porch: 136
    hsync_front_porch: 160
    vsync_pulse_width: 2
    vsync_back_porch: 21
    vsync_front_porch: 12
    # JD9165 vendor init for the 2026 "New Panel". ESPHome appends
    # PIXFMT/MADCTL/INVOFF/SLPOUT/DISPON, so do not add 0x3A, 0x36 or 0x29.
    # Both delays and the trailing 0x11 are load-bearing (see below).
    init_sequence:
      # The JD9165 needs 120ms after reset before it accepts the vendor table.
      # ESPHome holds only SLPOUT until 120ms after reset, not the vendor
      # table, so the wait is declared here. Without it the panel comes up
      # white on a warm reboot; a cold boot survives on power-on settling.
      - delay 120ms
      - [0x30, 0x00]
      - [0xF7, 0x49, 0x61, 0x02, 0x00]
      - [0x30, 0x01]
      - [0x04, 0x0C]
      - [0x05, 0x08]
      - [0x0B, 0x11]
      - [0x20, 0x04]
      - [0x1F, 0x05]
      - [0x23, 0x38]
      - [0x28, 0x18]
      - [0x29, 0x29]
      - [0x2A, 0x01]
      - [0x2B, 0x29]
      - [0x2C, 0x01]
      - [0x30, 0x02]
      - [0x00, 0x05]
      - [0x01, 0x22]
      - [0x02, 0x08]
      - [0x03, 0x12]
      - [0x04, 0x16]
      - [0x05, 0x64]
      - [0x06, 0x00]
      - [0x07, 0x00]
      - [0x08, 0x78]
      - [0x09, 0x00]
      - [0x0A, 0x04]
      - [0x0B, 0x16, 0x17, 0x0B, 0x0D, 0x0D, 0x0D, 0x11, 0x10, 0x07, 0x07, 0x09]
      - [0x0C, 0x09, 0x1E, 0x1E, 0x1C, 0x1C, 0x0D, 0x0D, 0x0D, 0x0D, 0x0D, 0x0D]
      - [0x0D, 0x0A, 0x05, 0x0B, 0x0D, 0x0D, 0x0D, 0x11, 0x10, 0x06, 0x06, 0x08]
      - [0x0E, 0x08, 0x1F, 0x1F, 0x1D, 0x1D, 0x0D, 0x0D, 0x0D, 0x0D, 0x0D, 0x0D]
      - [0x0F, 0x0A, 0x05, 0x0D, 0x0B, 0x0D, 0x0D, 0x11, 0x10, 0x1D, 0x1D, 0x1F]
      - [0x10, 0x1F, 0x08, 0x08, 0x06, 0x06, 0x0D, 0x0D, 0x0D, 0x0D, 0x0D, 0x0D]
      - [0x11, 0x16, 0x17, 0x0D, 0x0B, 0x0D, 0x0D, 0x11, 0x10, 0x1C, 0x1C, 0x1E]
      - [0x12, 0x1E, 0x09, 0x09, 0x07, 0x07, 0x0D, 0x0D, 0x0D, 0x0D, 0x0D, 0x0D]
      - [0x13, 0x00, 0x00, 0x00, 0x00]
      - [0x14, 0x00, 0x00, 0x41, 0x41]
      - [0x15, 0x00, 0x00, 0x00, 0x00]
      - [0x17, 0x00]
      - [0x18, 0x85]
      - [0x19, 0x06, 0x09]
      - [0x1A, 0x05, 0x08]
      - [0x1B, 0x0A, 0x04]
      - [0x26, 0x00]
      - [0x27, 0x00]
      - [0x30, 0x06]
      - [0x12, 0x3F, 0x25, 0x27, 0x35, 0x1D, 0x1B, 0x1B, 0x1A, 0x18, 0x0A, 0x2A, 0x21, 0x19, 0x30]
      - [0x13, 0x3F, 0x26, 0x27, 0x35, 0x1E, 0x1C, 0x1C, 0x1A, 0x18, 0x0B, 0x2A, 0x21, 0x19, 0x30]
      - [0x30, 0x0A]
      - [0x02, 0x4F]
      - [0x0B, 0x40]
      - [0x30, 0x0D]
      - [0x0D, 0x04]
      - [0x10, 0x05]
      - [0x11, 0x0C]
      - [0x12, 0x05]
      - [0x13, 0x0C]
      - [0x30, 0x00]
      # Deliberate SLPOUT for vendor-timing fidelity: Guition's driver waits
      # 120ms between sleep-out and display-on, while ESPHome appends its own
      # SLPOUT then DISPON only ~10ms later. This pair restores that margin.
      - [0x11]
      - delay 120ms

# Standard Sensors and Buttons
button:
  - platform: restart
    name: restart
  - platform: safe_mode
    name: restart safe
    icon: mdi:restart-alert

binary_sensor:
  - platform: status
    name: status

text_sensor:
  - platform: homeassistant
    entity_id: sensor.time_normal
    id: ha_time
    on_value:
      - lvgl.label.update:
          id: display_time
          text: !lambda |-
            return id(ha_time).state.c_str();

sensor:
  - platform: homeassistant
    entity_id: sensor.wc_outdoor_temperature
    id: ha_outdoor_temperature
    on_value:
      - lvgl.label.update:
          id: outdoor_temperature
          text:
            format: "%d"
            args: ['(int)round(x)']
  - platform: homeassistant
    entity_id: sensor.wc_outdoor_humidity
    id: ha_outdoor_humidity
    on_value:
      - lvgl.label.update:
          id: outdoor_humidity
          text:
            format: "%d"
            args: ['(int)round(x)']
  - platform: homeassistant
    entity_id: sensor.wc_today_high
    id: ha_today_high
    on_value:
      - lvgl.label.update:
          id: today_high
          text:
            format: "%d"
            args: ['(int)round(x)']
  - platform: homeassistant
    entity_id: sensor.wc_today_low
    id: ha_today_low
    on_value:
      - lvgl.label.update:
          id: today_low
          text:
            format: "%d"
            args: ['(int)round(x)']
  - platform: homeassistant
    entity_id: sensor.wc_${name}_temperature
    id: ha_indoor_temperature
    on_value:
      - lvgl.label.update:
          id: indoor_temperature
          text:
            format: "%d"
            args: ['(int)round(x)']
  - platform: homeassistant
    entity_id: sensor.wc_${name}_humidity
    id: ha_indoor_humidity
    on_value:
      - lvgl.label.update:
          id: indoor_humidity
          text:
            format: "%d"
            args: ['(int)round(x)']

# Fonts and styles for display
font:
  - file:
      type: gfonts
      family: IBM+Plex+Mono
      weight: 700
    id: clock_font
    size: 260
    bpp: 4
  - file:
      type: gfonts
      family: IBM+Plex+Mono
      weight: 700
    id: info_font
    size: 85
    bpp: 4
  - file:
      type: gfonts
      family: IBM+Plex+Mono
      weight: 700
    id: small_info_font
    size: 70
    bpp: 4

# Actual weather clock layout
lvgl:
  # Special LVGL settings required for this display
  rotation: ${rotation | default("0")}
  style_definitions:
    - id: clock_style
      text_font: clock_font
      text_color: 0xDDDDDD
    - id: outdoor_style
      text_font: info_font
      text_color: 0x008001
    - id: small_outdoor_style
      text_font: small_info_font
      text_color: 0x008001
      translate_y: -4
      opa: 0.8
    - id: indoor_style
      text_font: info_font
      text_color: 0xBDB76B
    - id: small_indoor_style
      text_font: small_info_font
      text_color: 0xBDB76B
      translate_y: -4
      opa: 0.8
    - id: high_style
      text_font: info_font
      text_color: 0xFE0000
    - id: small_high_style
      text_font: small_info_font
      text_color: 0xFE0000
      translate_y: -4
      opa: 0.8
    - id: low_style
      text_font: info_font
      text_color: 0x1F90FF
    - id: small_low_style
      text_font: small_info_font
      text_color: 0x1F90FF
      translate_y: -4
      opa: 0.8
  pages:
    - id: main_page
      width: 100%
      bg_color: Black
      widgets:
        # Clock
        - label:
            text: "--:--"
            id: display_time
            styles: clock_style
            align: top_mid
            x: 0
            y: -40
            text_align: center
        # Outdoor
        - obj:
            scrollbar_mode: "OFF"
            border_width: 0
            pad_all: 0px
            align: bottom_left
            x: 15
            y: -25
            width: 240
            height: 100
            bg_color: Black
            layout:
                type: FLEX
                flex_flow: ROW_WRAP
                flex_align_main: start
                flex_align_cross: end
                pad_column: 5px
                pad_row: 0px
            widgets:
              - label:
                  text: "--"
                  id: outdoor_humidity
                  styles: outdoor_style
                  text_align: left
              - label:
                  styles: small_outdoor_style
                  text: "%"
                  text_align: left
        - obj:
            scrollbar_mode: "OFF"
            border_width: 0
            pad_all: 0px
            align: bottom_left
            x: 15
            y: -115
            width: 240
            height: 100
            bg_color: Black
            layout:
                type: FLEX
                flex_flow: ROW_WRAP
                flex_align_main: start
                flex_align_cross: end
                pad_column: 0px
                pad_row: 0px
            widgets:
              - label:
                  text: "--"
                  id: outdoor_temperature
                  styles: outdoor_style
                  text_align: left
              - label:
                  text: ${tempscale}
                  styles: small_outdoor_style
                  text_align: left
        # Forecast
        - obj:
            scrollbar_mode: "OFF"
            border_width: 0
            pad_all: 0px
            align: bottom_mid
            x: 0
            y: -25
            width: 240
            height: 100
            bg_color: Black
            layout:
                type: FLEX
                flex_flow: ROW_WRAP
                flex_align_main: center
                flex_align_cross: end
                pad_column: 0px
                pad_row: 0px
            widgets:
              - label:
                  text: "--"
                  id: today_low
                  styles: low_style
                  text_align: left
              - label:
                  styles: small_low_style
                  text: ${tempscale}
                  text_align: left
        - obj:
            scrollbar_mode: "OFF"
            border_width: 0
            pad_all: 0px
            align: bottom_mid
            x: 0
            y: -115
            width: 240
            height: 100
            bg_color: Black
            layout:
                type: FLEX
                flex_flow: ROW_WRAP
                flex_align_main: center
                flex_align_cross: end
                pad_column: 0px
                pad_row: 0px
            widgets:
              - label:
                  text: "--"
                  id: today_high
                  styles: high_style
                  text_align: left
              - label:
                  styles: small_high_style
                  text: ${tempscale}
                  text_align: left
        # Indoor
        - obj:
            scrollbar_mode: "OFF"
            border_width: 0
            pad_all: 0px
            align: bottom_right
            x: -15
            y: -25
            width: 240
            height: 100
            bg_color: Black
            layout:
                type: FLEX
                flex_flow: ROW_WRAP
                flex_align_main: end
                flex_align_cross: end
                pad_column: 5px
                pad_row: 0px
            widgets:
              - label:
                  text: "--"
                  id: indoor_humidity
                  styles: indoor_style
                  text_align: left
              - label:
                  styles: small_indoor_style
                  text: "%"
                  text_align: left
        - obj:
            scrollbar_mode: "OFF"
            border_width: 0
            pad_all: 0px
            align: bottom_right
            x: -15
            y: -115
            width: 240
            height: 100
            bg_color: Black
            layout:
                type: FLEX
                flex_flow: ROW_WRAP
                flex_align_main: end
                flex_align_cross: end
                pad_column: 0px
                pad_row: 0px
            widgets:
              - label:
                  text: "--"
                  id: indoor_temperature
                  styles: indoor_style
                  text_align: left
              - label:
                  styles: small_indoor_style
                  text: ${tempscale}
                  text_align: left
