# ESP32-S3-Touch-LCD-7
substitutions:
  name: the
  room: none
  dname: ${name}-wclk
  uname: ${name}_wclk
  tempscale: "°F"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_ESPTOOLPY_FLASHSIZE_8MB: y

esphome:
  name: ${dname}
          
ota:
  platform: esphome

api:

logger:
  level: DEBUG
  hardware_uart: UART0

# Video memory
psram:
  mode: octal
  speed: 80MHz

ch422g:
  - id: io_ex

# i2c connections
i2c:
  sda: 8
  scl: 9
  frequency: 400kHz
  scan: true
  id: bus_a

# Touch screen
touchscreen:
  platform: gt911
  address: 0x5D
  id: my_touchscreen
  update_interval: 16ms
  interrupt_pin: 4
  reset_pin:
    ch422g: io_ex
    number: 1

# Display
display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: device_display
    # For older boards, this overrides the default and stops ESPHome from claiming the CH422G pin
    enable_pin: null 

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_ssid_password

button:
  - platform: restart
    name: restart
  - platform: safe_mode
    name: restart safe
    icon: mdi:restart-alert

binary_sensor:
  - platform: status
    name: status

text_sensor:
  - platform: homeassistant
    entity_id: sensor.time_normal
    id: ha_time
    on_value:
      - lvgl.label.update:
          id: display_time
          text: !lambda |-
            return id(ha_time).state.c_str();

sensor:
  - platform: wifi_signal
    name:  wifi signal
    entity_category: diagnostic
  - platform: homeassistant
    entity_id: sensor.wc_outdoor_temperature
    id: ha_outdoor_temperature
    on_value:
      - lvgl.label.update:
          id: outdoor_temperature
          text:
            format: "%d"
            args: ['(int)round(x)']
  - platform: homeassistant
    entity_id: sensor.wc_outdoor_humidity
    id: ha_outdoor_humidity
    on_value:
      - lvgl.label.update:
          id: outdoor_humidity
          text:
            format: "%d"
            args: ['(int)round(x)']
  - platform: homeassistant
    entity_id: sensor.wc_today_high
    id: ha_today_high
    on_value:
      - lvgl.label.update:
          id: today_high
          text:
            format: "%d"
            args: ['(int)round(x)']
  - platform: homeassistant
    entity_id: sensor.wc_today_low
    id: ha_today_low
    on_value:
      - lvgl.label.update:
          id: today_low
          text:
            format: "%d"
            args: ['(int)round(x)']
  - platform: homeassistant
    entity_id: sensor.wc_${name}_temperature
    id: ha_indoor_temperature
    on_value:
      - lvgl.label.update:
          id: indoor_temperature
          text:
            format: "%d"
            args: ['(int)round(x)']
  - platform: homeassistant
    entity_id: sensor.wc_${name}_humidity
    id: ha_indoor_humidity
    on_value:
      - lvgl.label.update:
          id: indoor_humidity
          text:
            format: "%d"
            args: ['(int)round(x)']
  - platform: homeassistant
    entity_id: sensor.${room}_count
    id: ha_${room}_count
    on_value:
      - if:
          # if the room is passed in, show the count segments at the bottom of the display
          condition:
            lambda: 'return !id(ha_${room}_count).has_state() || std::isnan(id(ha_${room}_count).state);'
          then:
            - lvgl.obj.update: { id: seg1, hidden: true }
            - lvgl.obj.update: { id: seg2, hidden: true }
            - lvgl.obj.update: { id: seg3, hidden: true }
            - lvgl.obj.update: { id: seg4, hidden: true }
            - lvgl.obj.update: { id: seg5, hidden: true }
            - lvgl.obj.update: { id: seg6, hidden: true }
            - lvgl.obj.update: { id: seg7, hidden: true }
            - lvgl.obj.update: { id: seg8, hidden: true }
            - lvgl.obj.update: { id: button_left, clickable: false }
            - lvgl.obj.update: { id: button_right, clickable: false }
          else:
            - lvgl.obj.update: { id: seg1, hidden: false, bg_color: !lambda 'return (x >= 1) ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x333333);' }
            - lvgl.obj.update: { id: seg2, hidden: false, bg_color: !lambda 'return (x >= 2) ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x333333);' }
            - lvgl.obj.update: { id: seg3, hidden: false, bg_color: !lambda 'return (x >= 3) ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x333333);' }
            - lvgl.obj.update: { id: seg4, hidden: false, bg_color: !lambda 'return (x >= 4) ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x333333);' }
            - lvgl.obj.update: { id: seg5, hidden: false, bg_color: !lambda 'return (x >= 5) ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x333333);' }
            - lvgl.obj.update: { id: seg6, hidden: false, bg_color: !lambda 'return (x >= 6) ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x333333);' }
            - lvgl.obj.update: { id: seg7, hidden: false, bg_color: !lambda 'return (x >= 7) ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x333333);' }
            - lvgl.obj.update: { id: seg8, hidden: false, bg_color: !lambda 'return (x >= 8) ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x333333);' }
            - lvgl.obj.update: { id: button_left, clickable: true }
            - lvgl.obj.update: { id: button_left, clickable: true }

# Backlight
output:
  - platform: ledc
    pin: GPIO16
    id: backlight

light:
  - platform: monochromatic
    output: backlight
    name: backlight
    restore_mode: ALWAYS_ON

switch:
  - platform: template
    name: antiburn
    icon: mdi:television-shimmer
    optimistic: true
    entity_category: "config"
    turn_on_action:
      - logger.log: "Starting Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - lvgl.pause:
          show_snow: true
    turn_off_action:
      - logger.log: "Stopping Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:

  - platform: gpio
    name: backlight switch
    pin: 
      ch422g: io_ex
      number: 2
    restore_mode: ALWAYS_ON
    internal: true

#fonts and styles for display
font:
  - file:
      type: gfonts
      family: IBM+Plex+Mono
      weight: 700
    id: clock_font
    size: 260
    bpp: 4

  - file:
      type: gfonts
      family: IBM+Plex+Mono
      weight: 700
    id: info_font
    size: 85
    bpp: 4

  - file:
      type: gfonts
      family: IBM+Plex+Mono
      weight: 700
    id: small_info_font
    size: 70
    bpp: 4

#actual weather clock layout
lvgl:
  touchscreens: my_touchscreen
  style_definitions:
    - id: clock_style
      text_font: clock_font
      text_color: 0xDDDDDD
    - id: outdoor_style
      text_font: info_font
      text_color: 0x008001
    - id: small_outdoor_style
      text_font: small_info_font
      text_color: 0x008001
      translate_y: -4
      opa: 0.8
    - id: indoor_style
      text_font: info_font
      text_color: 0xBDB76B
    - id: small_indoor_style
      text_font: small_info_font
      text_color: 0xBDB76B
      translate_y: -4
      opa: 0.8
    - id: high_style
      text_font: info_font
      text_color: 0xFE0000
    - id: small_high_style
      text_font: small_info_font
      text_color: 0xFE0000
      translate_y: -4
      opa: 0.8
    - id: low_style
      text_font: info_font
      text_color: 0x1F90FF
    - id: small_low_style
      text_font: small_info_font
      text_color: 0x1F90FF
      translate_y: -4
      opa: 0.8
  pages:
    - id: main_page
      width: 100%
      bg_color: Black
      scrollbar_mode: "OFF"
      widgets:
        # Clock
        - label:
            text: "--:--"
            id: display_time
            styles: clock_style
            align: top_mid
            x: 0
            y: -40
            text_align: center
        # Outdoor
        - obj:
            scrollbar_mode: "OFF"
            border_width: 0
            pad_all: 0px
            align: bottom_left
            x: 15
            y: -25
            width: 240
            height: 100
            bg_color: Black
            layout:
                type: FLEX
                flex_flow: ROW_WRAP
                flex_align_main: start
                flex_align_cross: end
                pad_column: 5px
                pad_row: 0px
            widgets:
              - label:
                  text: "--"
                  id: outdoor_humidity
                  styles: outdoor_style
                  text_align: left
              - label:
                  styles: small_outdoor_style
                  text: "%"
                  text_align: left
        - obj:
            scrollbar_mode: "OFF"
            border_width: 0
            pad_all: 0px
            align: bottom_left
            x: 15
            y: -115
            width: 240
            height: 100
            bg_color: Black
            layout:
                type: FLEX
                flex_flow: ROW_WRAP
                flex_align_main: start
                flex_align_cross: end
                pad_column: 0px
                pad_row: 0px
            widgets:
              - label:
                  text: "--"
                  id: outdoor_temperature
                  styles: outdoor_style
                  text_align: left
              - label:
                  text: ${tempscale}
                  styles: small_outdoor_style
                  text_align: left
        # Forecast
        - obj:
            scrollbar_mode: "OFF"
            border_width: 0
            pad_all: 0px
            align: bottom_mid
            x: 0
            y: -25
            width: 240
            height: 100
            bg_color: Black
            layout:
                type: FLEX
                flex_flow: ROW_WRAP
                flex_align_main: center
                flex_align_cross: end
                pad_column: 0px
                pad_row: 0px
            widgets:
              - label:
                  text: "--"
                  id: today_low
                  styles: low_style
                  text_align: left
              - label:
                  styles: small_low_style
                  text: ${tempscale}
                  text_align: left
        - obj:
            scrollbar_mode: "OFF"
            border_width: 0
            pad_all: 0px
            align: bottom_mid
            x: 0
            y: -115
            width: 240
            height: 100
            bg_color: Black
            layout:
                type: FLEX
                flex_flow: ROW_WRAP
                flex_align_main: center
                flex_align_cross: end
                pad_column: 0px
                pad_row: 0px
            widgets:
              - label:
                  text: "--"
                  id: today_high
                  styles: high_style
                  text_align: left
              - label:
                  styles: small_high_style
                  text: ${tempscale}
                  text_align: left
        # Indoor
        - obj:
            scrollbar_mode: "OFF"
            border_width: 0
            pad_all: 0px
            align: bottom_right
            x: -15
            y: -25
            width: 240
            height: 100
            bg_color: Black
            layout:
                type: FLEX
                flex_flow: ROW_WRAP
                flex_align_main: end
                flex_align_cross: end
                pad_column: 5px
                pad_row: 0px
            widgets:
              - label:
                  text: "--"
                  id: indoor_humidity
                  styles: indoor_style
                  text_align: left
              - label:
                  styles: small_indoor_style
                  text: "%"
                  text_align: left
        - obj:
            scrollbar_mode: "OFF"
            border_width: 0
            pad_all: 0px
            align: bottom_right
            x: -15
            y: -115
            width: 240
            height: 100
            bg_color: Black
            layout:
                type: FLEX
                flex_flow: ROW_WRAP
                flex_align_main: end
                flex_align_cross: end
                pad_column: 0px
                pad_row: 0px
            widgets:
              - label:
                  text: "--"
                  id: indoor_temperature
                  styles: indoor_style
                  text_align: left
              - label:
                  styles: small_indoor_style
                  text: ${tempscale}
                  text_align: left
        # People Count segments
        - obj:
            scrollbar_mode: "OFF"
            border_width: 0
            pad_all: 0px
            align: bottom_mid
            x: 0
            y: 0
            width: 562
            height: 10
            bg_color: Black
            layout:
                type: FLEX
                flex_flow: ROW
                flex_align_main: center
                flex_align_cross: center
                pad_column: 8px
                pad_row: 0px
            widgets:
              - obj: { id: seg2, width: 90, height: 5, border_width: 0, bg_color: 0x333333, hidden: true }
              - obj: { id: seg3, width: 90, height: 5, border_width: 0, bg_color: 0x333333, hidden: true }
              - obj: { id: seg4, width: 90, height: 5, border_width: 0, bg_color: 0x333333, hidden: true }
              - obj: { id: seg5, width: 90, height: 5, border_width: 0, bg_color: 0x333333, hidden: true }
              - obj: { id: seg6, width: 90, height: 5, border_width: 0, bg_color: 0x333333, hidden: true }
              - obj: { id: seg7, width: 90, height: 5, border_width: 0, bg_color: 0x333333, hidden: true }
        # Left Button Overlay (Segment 1)
        - obj:
            id: button_left
            width: 180
            height: 180
            align: bottom_left
            x: 5
            y: 15
            bg_color: Black
            bg_opa: 0
            border_width: 0
            clickable: false
            on_click:
              - logger.log: "Left button pressed!"
              - homeassistant.service:
                  service: button.press
                  data:
                    entity_id: button.${room}_adjust_1_2
            widgets:
              - obj:
                  id: seg1
                  width: 90
                  height: 5
                  align: bottom_left
                  border_width: 0
                  bg_color: 0x333333
                  clickable: false
                  hidden: true
        # Right Button Overlay (Segment 8)
        - obj:
            id: button_right
            width: 180
            height: 180
            align: bottom_right
            x: -5
            y: 15
            bg_color: Black
            bg_opa: 0
            border_width: 0
            clickable: false
            on_click:
              - logger.log: "Right button pressed!"
              - homeassistant.service:
                  service: button.press
                  data:
                    entity_id: button.${room}_adjust_1
            widgets:
              - obj:
                  id: seg8
                  width: 90
                  height: 5
                  align: bottom_right
                  border_width: 0
                  bg_color: 0x333333
                  clickable: false
                  hidden: true