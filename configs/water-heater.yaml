    decode: uint16_be
    byte_offset: 2
    multiplier: 0.1
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    device_class: temperature
    entity_category: diagnostic

  - platform: gea
    gea_id: gea_hub
    name: "Maximum Vacation Hours"
    id: max_vacation_hours
