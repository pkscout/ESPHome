substitutions:
  name: ph65s10bpy
  friendly_name: GE PH65S10BPY

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_ssid_password

external_components:
  - source: github://mguaylam/esphome-gea
    components: [gea]

# ============================================================
# GEA3 / FIRSTBUILD HOME ASSISTANT ADAPTER
#
# FirstBuild adapter + Seeed XIAO ESP32-C3
#
# GEA3:
#   TX = GPIO21
#   RX = GPIO20
#   230400 baud, 8N1, full duplex
# ============================================================

uart:
  id: uart_gea
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 230400

gea:
  id: gea_hub
  uart_id: uart_gea
  protocol: gea3
  dest_address: 0xC0
  erd_lookup: true


# ============================================================
# TEMPERATURES
# ============================================================

sensor:

  # ----------------------------------------------------------
  # Water heater temperature sensors
  # ----------------------------------------------------------

  - platform: gea
    gea_id: gea_hub
    name: "T1 Temperature"
    id: t1_temperature
    erd: 0x405F
    decode: int16_be
    multiplier: 0.1
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement

  - platform: gea
    gea_id: gea_hub
    name: "T2 Temperature"
    id: t2_temperature
    erd: 0x4060
    decode: int16_be
    multiplier: 0.1
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    device_class: temperature
